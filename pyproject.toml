[project]
name = "agent"
version = "0.1.0"
description = "Research Paper Intelligence Agent — multi-hop citation RAG for ML papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "networkx>=3.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
    "cohere>=5.0.0",
    "tiktoken>=0.8.0",
    "pyvis>=0.3.0",
    "streamlit-agraph>=0.0.45",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "langsmith>=0.1.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "flagembedding>=1.4.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
paper-agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "config", "eval", "frontend", "graph_engine", "rag", "tools"]
